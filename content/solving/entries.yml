# Problem → solution entries for /solve/.
# Add a new entry under `entries:` — no code changes required.
# Required: slug, title, problem, solution, type, date.
# Optional: url, image, icon, display, images, video, body, links, stack, order, note.
# display: icon | screenshot — force squircle vs browser-frame treatment.
# icon: dedicated app-icon asset (preferred for apps when present).
# Story Rocket (the company) does not belong here as a case study — products do.
entries:
  - slug: scoreboardtv
    title: ScoreboardTV
    problem: Families and coaches needed a live scoreboard they could run from a phone while the gym watched on a TV.
    solution: A native iOS controller paired with an Apple TV board — phone runs the game, the room sees the score.
    type: app
    date: "2024-01"
    url: https://apps.apple.com/us/app/scoreboardtv-basketball/id6462727193
    stack:
      - Swift
      - SwiftUI
      - tvOS
      - iOS
    order: 1
    note: Built under Story Rocket. Archival screenshots not yet in this repo.
    links:
      - label: App Store
        url: https://apps.apple.com/us/app/scoreboardtv-basketball/id6462727193
      - label: Story Rocket
        url: https://www.storyrocket.io/company/scoreboardtv/
    body: |
      ScoreboardTV transforms Apple TV and iPad into a clear, game-ready scoreboard system. Whether you’re hosting recreational games, church leagues, or school tournaments, scorekeeping stays simple, affordable, and accessible — without buying a dedicated hardware board.

      Designed with churches and schools in mind. Many organizations use the same gym for worship and sports — like Upward Basketball. Instead of investing in costly professional scoreboard systems, ScoreboardTV uses the TVs, iPads, and Apple TVs you already own.

      Built as an iOS and tvOS SwiftUI app: professional basketball scoreboard UI, real-time control from a companion iPad, team name editing, custom colors, period tracking, possession arrow, and bonus indicators. Free trial and subscription pricing for schools, churches, and gyms.

