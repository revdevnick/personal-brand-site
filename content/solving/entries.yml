  - slug: precisionflight
    title: PrecisionFlight for DJI Drones
    problem: Commercial and enterprise drone teams needed reliable flight software for DJI airframes and sensors — visual, thermal, and multispectral — without a fragile legacy codebase.
    solution: Key iOS work on PrecisionFlight — Swift modernization, new features, CI to the App Store and HockeyApp, security hardening, and field QA.
    type: app
    date: 2018
    url: https://itunes.apple.com/us/app/precisionflight-for-dji-drones/id1112592228?mt=8
    image: /solve/precisionflight/feature.png
    images:
      - /solve/precisionflight/ipad.jpg
    stack:
      - Swift
      - DJI SDK
      - MapKit
      - Core Data
    order: 1
    links:
      - label: App Store
        url: https://itunes.apple.com/us/app/precisionflight-for-dji-drones/id1112592228?mt=8
    body: |
      Key developer for the PrecisionFlight iOS app that utilized DJI commercial and enterprise drones (Matrice 100/200/600, Mavic Pro and Phantoms) to capture aerial imagery with built-in and interchangeable sensors (visual, thermal, multispectral).

      Work included pivotal legacy moves to Swift 4.1, new features, performance improvements, automated release and testing to the App Store and HockeyApp with Jenkins, and security changes to protect and obfuscate data. Field and office QA, App Store marketing presence, and UI/UX ideas for a better customer experience. Agile/Scrum with Jira and Git. DJI SDK, Core Data, MapKit, iCloud, GCD, MVC, MVVM, plus Alamofire, Mapbox, AWS, Fabric, and Mixpanel.

  - slug: persistchat
    title: PersistChat
    problem: Learning Core Data for real meant shipping something that looked like a messenger — friends, threads, and messages that survive relaunch — not another toy tutorial.
    solution: A fictitious chat app with a custom tab bar, seeded friends and messages, send/receive simulation, and a Core Data stack meant to be reused later.
    type: app
    date: 2017
    url: https://github.com/nickprkins/PersistChat
    image: /solve/persistchat/feature.png
    images:
      - /solve/persistchat/screen-1.png
      - /solve/persistchat/screen-2.png
      - /solve/persistchat/screen-3.png
      - /solve/persistchat/screen-4.png
    stack:
      - Swift
      - Core Data
    order: 2
    links:
      - label: GitHub
        url: https://github.com/nickprkins/PersistChat
    body: |
      A fictitious chat app that persists in Core Data. It uses a custom UITabBarController and loads recent messages when the app launches. You can send messages to friends in the recent list and simulate incoming messages. Built to learn a Core Data stack for future projects.

  - slug: food-genie
    title: Food Genie
    problem: People who could not decide where to eat needed an unbiased third party, not another list.
    solution: A small wheel of nearby places — first a web tool for coworkers, then an iOS app that shipped to the App Store.
    type: app
    date: 2017
    url: https://appsto.re/us/jQF0db.i
    image: /solve/food-genie/feature.png
    images:
      - /solve/food-genie/phone.jpg
      - /solve/food-genie/wheel.jpg
      - /solve/food-genie/result.jpg
    stack:
      - Swift
      - Location
      - Yelp API
    order: 3
    links:
      - label: App Store
        url: https://appsto.re/us/jQF0db.i
      - label: Product Hunt
        url: https://www.producthunt.com/posts/food-genie-decide-where-to-eat-find-restaurants
      - label: PhoneDog Top 10 (Feb 2017)
        url: http://www.phonedog.com/videos/top-10-ios-apps-february-2017
      - label: TWIT iOS Today
        url: https://youtu.be/xvhJ1KnNOGw
    body: |
      Food Genie started as a web tool at Electronic Solutions when coworkers could not decide where to eat. That idea became the Iron Yard final project — Yelp’s API, six nearby places on a wheel, a pan gesture to spin, then an overlay with restaurant details and a jump into Yelp for directions.

      The iOS app shipped with Swift 2.3 and CocoaPods. PhoneDog named it a Top 10 iOS app for February 2017; Megan Morrone and Leo Laporte covered it on TWIT’s iOS Today. Also listed on Product Hunt.

