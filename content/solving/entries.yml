# Problem → solution entries for /solve/.
# Add a new entry under `entries:` — no code changes required.
# Required: slug, title, problem, solution, type, date.
# Optional: url, image, images, video, body, links, stack, order, note.
# Story Rocket (the company) does not belong here as a case study — products do.
entries:
  - slug: scoreboardtv
    title: ScoreboardTV
    problem: Families and coaches needed a live scoreboard they could run from a phone while the gym watched on a TV.
    solution: A native iOS controller paired with an Apple TV board — phone runs the game, the room sees the score.
    type: app
    date: 2024
    stack:
      - Swift
      - tvOS
      - iOS
    order: 1
    note: Built under Story Rocket. Archival screenshots not yet in this repo.

  - slug: b4ufly
    title: B4UFLY
    problem: Drone pilots in the US needed a clear answer about airspace before they flew — and the FAA needed an app named in every new drone's manual.
    solution: Kittyhawk partnered with the FAA on B4UFLY — maps and rules on a phone so recreational flyers can check where they can fly.
    type: app
    date: 2021
    url: https://apps.apple.com/us/app/b4ufly-drone-airspace/id992427109
    image: /solve/b4ufly/feature.jpg
    images:
      - /solve/b4ufly/screenshot.png
    stack:
      - Swift
      - Maps
      - Aviation
    order: 1
    links:
      - label: App Store
        url: https://apps.apple.com/us/app/b4ufly-drone-airspace/id992427109
      - label: FAA B4UFLY
        url: https://www.faa.gov/uas/recreational_fliers/where_can_i_fly/b4ufly/
    body: |
      Kittyhawk partnered with the FAA to help develop B4UFLY. If you buy a drone in the United States, this app is listed in the manual so pilots can understand the airspace they are about to fly in.

