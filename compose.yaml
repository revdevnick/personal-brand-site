services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    stdin_open: true
    tty: true

  preview:
    profiles: ["preview"]
    build:
      context: .
      target: preview
    ports:
      - "8080:80"

volumes:
  node_modules:
